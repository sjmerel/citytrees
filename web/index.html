<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f1f8f7">
    <title>City Trees</title>
  </head>
  <body>
    <main id="map" aria-label="City Trees map"></main>
    <div id="status" role="status">
      <button id="close-status" class="close-button" type="button" aria-label="Dismiss message"><img alt=""></button>
      <span id="status-message">Loading map...</span>
      <button id="retry" type="button" hidden>Retry</button>
    </div>
    <section id="selection" aria-label="Selected tree" aria-live="polite" hidden>
      <button id="clear-selection" class="close-button" type="button" aria-label="Clear selection"><img alt=""></button>
      <div class="caption">Botanical name</div>
      <div class="botanical-row">
        <span id="genus-color" aria-hidden="true"></span>
        <span id="botanical-name"></span>
        <a id="wikipedia" target="_blank" rel="noopener noreferrer" aria-label="Open Wikipedia article"><img alt=""></a>
      </div>
      <div id="common-names-section">
        <div class="caption">Common names</div>
        <div id="common-names"></div>
      </div>
    </section>
    <nav id="controls" aria-label="Map controls" hidden>
      <button id="locate" class="map-button" type="button" aria-label="Show my location"><img alt=""></button>
      <button id="layers" class="map-button" type="button" aria-label="Toggle satellite imagery" aria-pressed="false"><img alt=""></button>
      <button id="show-about" class="map-button" type="button" aria-label="About City Trees"><img alt=""></button>
    </nav>
    <dialog id="about" aria-label="About City Trees">
      <iframe id="about-page" title="About City Trees" sandbox="allow-popups allow-popups-to-escape-sandbox"></iframe>
      <button id="close-about" class="close-button" type="button" aria-label="Close About" autofocus><img alt=""></button>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
